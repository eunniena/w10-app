<!doctype html>
<html lang="ko">
<head>

<meta name="description" content="10주차 「AI 글쓰기와 관점 형성, 설득」 수업 중 활동 ①–④ 온라인 실행 페이지">
<style>
:root{
  --navy:#1C1F4A; --orange:#D9481F; --teal:#1193A8; --indigo:#4C5AA8; --yellow:#F2B93B;
  --ink:#2B2F4A; --muted:#6B708A; --light:#F3F4F8; --line:#E1E3EC; --bg:#FFFFFF; --card:#FFFFFF;
  --a-t:#FBEAE4; --b-t:#E1F2F5; --y-t:#FDF3DC; --ghost:#A0A4B8;
}
@media (prefers-color-scheme: dark){

}
:root[data-theme="dark"]{ --ink:#E6E7F0; --muted:#A3A7BD; --light:#23263F; --line:#363A58; --bg:#15172B; --card:#1C1F36; --a-t:#3A2A28; --b-t:#1E3338; --y-t:#3A3324; --ghost:#7C809A; --navy:#DDE0F0; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 48px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0 12px;border-bottom:1px solid var(--line);margin-bottom:16px}
header .t{font-weight:700;font-size:15px}
header .s{font-size:12px;color:var(--muted)}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;color:#fff;background:var(--indigo)}
.pill.a{background:var(--orange)} .pill.b{background:var(--teal)} .pill.y{background:var(--yellow);color:#1C1F4A}
h1{font-size:22px;margin:0 0 6px} h2{font-size:18px;margin:18px 0 8px} h3{font-size:15px;margin:14px 0 6px}
p{margin:6px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
.tint-a{background:var(--a-t);border-color:transparent} .tint-b{background:var(--b-t);border-color:transparent} .tint-y{background:var(--y-t);border-color:transparent} .tint-l{background:var(--light);border-color:transparent}
button{font:inherit;border:0;border-radius:10px;padding:12px 18px;background:var(--navy);color:#fff;font-weight:700;cursor:pointer;min-height:44px}
button.sec{background:var(--light);color:var(--ink)} button.warn{background:var(--orange)} button.ok{background:var(--teal)}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:1fr;gap:8px}
label.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--card)}
label.opt input{margin-top:4px}
.scale{display:flex;gap:6px;flex-wrap:wrap}
.scale label{flex:1 1 40px;text-align:center;padding:10px 4px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--card);font-size:14px;min-width:40px}
.scale input{display:none}
.scale input:checked+span{display:block;background:var(--navy);color:#fff;border-radius:6px;padding:2px 0}
.q{margin:12px 0 4px;font-weight:700}
.hint{font-size:13px;color:var(--muted)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:18px;color:var(--orange)}
textarea,input[type=text],input[type=number],input[type=password]{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
textarea{min-height:160px;resize:vertical;line-height:1.6}
/* autocomplete editor */
.editor{position:relative;border:1px solid var(--line);border-radius:10px;background:var(--card);min-height:200px;padding:12px;font-size:17px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.editor .typed{color:var(--ink)} .editor .ghost{color:var(--ghost);font-style:italic}
.editor textarea{position:absolute;inset:0;width:100%;height:100%;opacity:0.001;padding:12px;font-size:17px;line-height:1.7;border:0;resize:none}
.editor.focus{outline:2px solid var(--indigo)}
.acbar{display:flex;gap:8px;align-items:center;margin-top:8px;min-height:44px}
.chat{border:1px solid var(--line);border-radius:12px;background:var(--light);padding:10px;max-height:52vh;overflow:auto}
.msg{max-width:88%;padding:10px 12px;border-radius:12px;margin:6px 0;font-size:15px;white-space:pre-wrap}
.msg.ai{background:var(--card);border:1px solid var(--line);margin-right:auto}
.msg.me{background:var(--navy);color:#fff;margin-left:auto}

.step{display:none} .step.on{display:block}
.progress{display:flex;gap:4px;margin:0 0 12px}
.progress span{flex:1;height:6px;border-radius:3px;background:var(--line)} .progress span.done{background:var(--teal)} .progress span.cur{background:var(--navy)}
.bar{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:14px}
.bar .lab{width:160px;color:var(--muted);text-align:right}
.bar .b{height:18px;background:var(--teal);border-radius:4px;min-width:2px}
.bar .b.a{background:var(--orange)} .bar .b.g{background:var(--muted)}
.bar .v{font-weight:700;min-width:48px}
table{width:100%;border-collapse:collapse;font-size:14px} td,th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top} th{background:var(--light)}

<body>
<div class="wrap" id="app">
<header>
  <div><div class="t">W10 · AI 글쓰기와 관점 형성, 설득</div><div class="s" id="hdr-sub">2026-2 커뮤니케이션특강 · 수업 중 활동</div></div>

<script>
/* =====================================================================
   설정 — 강의자가 바꿀 곳은 아래 API 한 줄뿐입니다.
   Apps Script를 '웹 앱'으로 배포한 뒤 나온 URL(…/exec)을 붙여 넣으세요.
   ===================================================================== */
const API = "https://script.google.com/macros/s/AKfycbybq47totovdlwxCMzfu23ectFn3XBq3gF_fKcVc8-tyibUBqCkdPcSrMUfncWJ_ivm/exec";

/* ---------- 활동 재료 (강의 스크립트 부록 C와 동일) ---------- */
const ACT1 = [
  { id:"q1", q:"Q1. 한쪽으로 기운 AI 자동완성을 받으며 사회 쟁점에 대해 글을 쓴 뒤, 태도(1–5점)는?", opts:["ⓐ 거의 그대로","ⓑ 0.4점쯤 AI 쪽","ⓒ 1점 이상 AI 쪽"], ans:1 },
  { id:"q2", q:"Q2. 그 자동완성이 ‘편향됐다’고 알아챈 사람은?", opts:["ⓐ 70% 이상","ⓑ 40% 안팎","ⓒ 20% 미만"], ans:2 },
  { id:"q3", q:"Q3. 쓰기 전에 “AI 제안이 당신과 다른 견해일 수 있고, 글이 편향될 수 있다”고 경고하면?", opts:["ⓐ 효과 사라짐","ⓑ 절반으로","ⓒ 거의 그대로"], ans:2 },
  { id:"q4", q:"Q4. 모두 같은 GPT와 대화했지만 상대를 ‘AI 챗봇’ 또는 ‘다른 참가자’로 소개했다. 누가 더 설득될까?", opts:["ⓐ AI라고 들은 쪽","ⓑ 사람이라고 들은 쪽","ⓒ 같다"], ans:0 },
];
const TOPIC2 = "대학 수업의 출석 점수는 폐지해야 한다";
const CARDS = {
  A: ["출석 점수는 배움이 아니라 ‘자리에 앉아 있었는지’를 평가할 뿐이다.","성인인 대학생에게 수업 참여 여부는 스스로 책임질 선택이어야 한다.","녹화 강의와 온라인 자료가 있는 지금, 출석 강제는 학습 방식의 다양성을 막는다.","아르바이트나 돌봄을 병행하는 학생에게 출석 점수는 불평등하게 작동한다.","출석 대신 과제와 참여의 질로 평가하면 수업의 긴장감이 오히려 높아진다.","대리 출석과 형식적 출석 체크에 드는 시간도 줄일 수 있다."],
  B: ["출석 점수는 꾸준히 수업에 오게 만드는 최소한의 장치다.","토론과 조별 활동은 같은 시간에 함께 있어야만 가능하다.","출석이 성적에 반영되지 않으면 결국 시험 직전 벼락치기만 늘어난다.","성실함도 대학이 평가하고 길러야 할 역량 가운데 하나다.","강의실에 오는 학생이 줄면 수업의 질이 모두에게 떨어진다.","출석 기록은 학습에 어려움을 겪는 학생을 일찍 발견하는 신호가 된다."],
};
const ACT2_ITEMS = [
  { id:"d1", type:"방해", q:"학생식당 가격은 적정하다" },
  { id:"d2", type:"방해", q:"기숙사 통금 시간은 없어져야 한다" },
  { id:"d3", type:"방해", q:"도서관 24시간 개방은 필요하다" },
  { id:"t1", type:"태도", q:"대학 수업의 출석 점수는 폐지해야 한다" },
  { id:"t2", type:"태도", q:"수강신청은 학년 우선이어야 한다" },
  { id:"t3", type:"태도", q:"대형 강의는 온라인으로 전환해야 한다" },
  { id:"t4", type:"태도", q:"팀 과제는 개인 과제보다 교육 효과가 크다" },
  { id:"p1", type:"인식", q:"제안 문장들은 합리적이고 균형 잡혀 있었다" },
  { id:"p2", type:"인식", q:"제안 문장이 내 생각과 논지에 영향을 주었다" },
];
const TOPIC3 = "OTT는 하나만 구독하면 충분하다";
const ACT4 = [
  { id:"ga", t:"가. “편향된 AI 자동완성으로 글을 쓴 사람은 AI 입장 쪽으로 태도가 이동했고, 짧은 경고문은 이 효과를 유의하게 줄이지 못했다(Williams-Ceci et al., 2026, p.7).”", ans:"정확", why:"‘짧은’, ‘유의하게’가 핵심 — 두 단어를 빼면 비약이 된다 (Core p.7–8)" },
  { id:"na", t:"나. “연구에 따르면 AI 경고 문구는 아무 소용이 없으므로 없애야 한다.”", ans:"비약", why:"검증된 건 짧은 일반 경고 1문장뿐. 작은 감소 가능성이 남고, 저자는 구체적 개입을 시험하라고 한다 (Core p.8)" },
  { id:"da", t:"다. “사람들은 AI를 사람보다 더 믿기 때문에 AI에게 더 쉽게 설득된다(Tomaino & Jung, 2026).”", ans:"비약", why:"메커니즘은 신뢰가 아니라 ‘덜 반박하기’. 사전검사에선 네 주제 중 셋에서 사람 관점을 더 가치 있게 봤고, 일방향 메시지에선 사람이 더 설득적 (Contrast p.5–6, 12–13)" },
  { id:"ra", t:"라. “두 연구는 AI와 대화하거나 함께 쓰는 것만으로 정치적 견해가 바뀔 수 있음을 보여 준다.”", ans:"확대", why:"A는 정치 쟁점이지만 자동완성·단기, B는 정치 주제를 제외 — 두 연구를 한 문장으로 묶으면 조건이 사라진다 (Core p.3, 9 · Contrast p.2)" },
];
/* 반박 표지 (Tomaino & Jung p.6의 4범주를 수업용 한국어로 번안) */
const MARKERS = {
  불일치: /(동의\s*(안|하지|못)|그건\s*아니|아닌\s*것\s*같|틀렸|잘못|아니에요|아니죠|아닙니다|동의할\s*수\s*없)/g,
  부정:   /(아니(?!면|라)|않|못\s|못하|없[다어음]|안\s+[가-힣])/g,
  대조:   /(하지만|그런데|근데|그러나|오히려|반면|그래도|그렇지만|다만)/g,
  이유:   /(왜냐하면|때문|니까|거든|이유는|이유로)/g,
};
function countMarkers(text){
  const out={}; let total=0;
  for (const [k,re] of Object.entries(MARKERS)){ const n=(text.match(re)||[]).length; out[k]=n; total+=n; }
  out.합계=total; return out;
}

/* ---------- 공통 ---------- */
const $ = (s,el=document)=>el.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const params = new URLSearchParams(location.search);
const VIEW = params.get("view") || "student";
const TEST = params.get("test") === "1";
let store = {};
try { store = JSON.parse(sessionStorage.getItem("w10") || "{}"); } catch(e){ store = {}; }
function save(){ try { sessionStorage.setItem("w10", JSON.stringify(store)); } catch(e){} }

async function api(action, payload={}, method="POST"){
  if (!API || API.startsWith("PASTE_")) throw new Error("API 주소가 설정되지 않았습니다(페이지 상단 API 상수).");
  const body = JSON.stringify({ action, ...payload });
  let res;
  if (method === "GET"){
    const u = API + (API.includes("?")?"&":"?") + "action=" + encodeURIComponent(action) + "&p=" + encodeURIComponent(JSON.stringify(payload)) + "&_=" + Date.now();
    res = await fetch(u, { method:"GET", redirect:"follow" });
  } else {
    res = await fetch(API, { method:"POST", redirect:"follow", body, headers:{ "Content-Type":"text/plain;charset=utf-8" } });
  }
  const txt = await res.text();
  let j; try { j = JSON.parse(txt); } catch(e){ throw new Error("서버 응답을 읽을 수 없습니다: " + txt.slice(0,120)); }
  if (j.error) throw new Error(j.error);
  return j;
}
function wordCount(s){ return (s.trim().match(/\S+/g)||[]).length; }
function nowISO(){ return new Date().toISOString(); }
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

/* ---------- 진행 상태(강의자가 연 활동) ---------- */
let serverState = { open:"all" }; // 'none' | '1' | '2' | '3' | '4' | 'all'
async function pollState(){
  try { const s = await api("state", {}, "GET"); serverState = s; } catch(e){}
}
function isOpen(step){ return serverState.open === "all" || String(serverState.open) === String(step); }

/* =====================================================================
   학생 뷰
   ===================================================================== */
const STEPS = ["intro","a1","a2","a3","a4","done"];
function render(step){
  store.step = step; save();
  const main = $("#main");
  const idx = STEPS.indexOf(step);
  const prog = STEPS.slice(1,5).map((s,i)=>`<span class="${i+1<idx?'done':(i+1===idx?'cur':'')}"></span>`).join("");
  main.innerHTML = `<div class="progress">${prog}</div><div id="stage"></div>`;
  $("#hdr-right").innerHTML = store.token ? `<span class="pill">${esc(store.token.slice(0,6))}</span>` : "";
  ({intro:vIntro,a1:vA1,a2:vA2,a3:vA3,a4:vA4,done:vDone})[step]();
  window.scrollTo(0,0);
}

function vIntro(){
  $("#stage").innerHTML = `
  <h1>수업 중 활동 ①–④</h1>
  <p>로그인·설치 없이 이 페이지에서 네 가지 활동을 합니다. 이름·학번은 받지 않으며, 응답은 익명 토큰으로만 저장됩니다. 대화 활동에 개인정보를 적지 마세요.</p>
  <div class="card tint-l small">
    <b>진행 순서</b> ① 예측 투표(3분) → ② 자동완성과 함께 글쓰기(9분) → ③ AI와 3라운드 토론(10분) → ④ 문장 판정(4분)<br>
    각 활동은 강의자가 열었을 때만 시작할 수 있습니다. 끝나면 ‘참여 확인 코드’가 표시됩니다.
  </div>
  <div class="row"><button id="start">${store.token ? "이어서 하기" : "시작하기"}</button>${TEST?'<span class="pill y">테스트 모드</span>':''}</div>
  <p class="err" id="e"></p>`;
  $("#start").onclick = async ()=>{
    const b=$("#start"); b.disabled=true; b.textContent="연결 중…";
    try {
      if (!store.token){
        const j = await api("join", { test: TEST, ua: navigator.userAgent.slice(0,80) });
        store.token = j.token; store.condA = j.condA; store.condC = j.condC; store.code = j.code; save();
      }
      await pollState();
      render(store.done1 ? (store.done2 ? (store.done3 ? (store.done4 ? "done" : "a4") : "a3") : "a2") : "a1");
    } catch(e){ $("#e").textContent = e.message; b.disabled=false; b.textContent="다시 시도"; }
  };
}

function gate(step, title, body){
  if (isOpen(step)) return false;
  $("#stage").innerHTML = `<h1>${title}</h1><div class="card tint-y">아직 강의자가 이 활동을 열지 않았습니다. 화면을 그대로 두세요 — 열리면 자동으로 시작됩니다.</div><p class="hint">${body||""}</p>`;
  const t = setInterval(async ()=>{ await pollState(); if (isOpen(step)){ clearInterval(t); render(store.step); } }, 8000);
  return true;
}

/* ---------- 활동 ① ---------- */
function vA1(){
  if (gate("1","활동 ① 예측 투표")) return;
  const qs = ACT1.map(q=>`<div class="q">${esc(q.q)}</div><div class="grid">${q.opts.map((o,i)=>`<label class="opt"><input type="radio" name="${q.id}" value="${i}"><span>${esc(o)}</span></label>`).join("")}</div>`).join("");
  $("#stage").innerHTML = `<h1>활동 ① 예측 투표 <span class="pill y">3분</span></h1><p class="hint">결과를 보기 전에 직관으로 답하세요. 수업 중 네 번에 걸쳐 회수합니다.</p>${qs}<div class="row" style="margin-top:16px"><button id="go">제출</button></div><p class="err" id="e"></p>`;
  $("#go").onclick = async ()=>{
    const ans = {};

function vA2write(){
  const cond = store.condA; // 'A' | 'B'
  const sugg = CARDS[cond];
  const log = store.a2log || { shown:0, accepted:0, acceptedWords:0, dismissed:0, events:[] };
  $("#stage").innerHTML = `
  <h1>활동 ② 글쓰기 <span class="pill y">5분</span> <span class="timer" id="tm">5:00</span></h1>
  <div class="card tint-l">주제: <b>“${esc(TOPIC2)}”</b>에 대한 <b>내 의견</b>을 5문장 이상 쓰세요.<br>
  <span class="small">글쓰기 도우미가 회색 글씨로 다음 문장을 제안합니다. 쓸 만하면 <b>수락</b>(PC는 Tab 키)하고, 아니면 계속 쓰면 사라집니다. 도우미를 쓰되, 당신 자신의 의견을 쓰세요.</span></div>
  <div class="editor" id="ed"><span class="typed" id="typed"></span><span class="ghost" id="ghost"></span><textarea id="ta" aria-label="글쓰기" spellcheck="false"></textarea></div>
  <div class="acbar"><button class="ok" id="acc" disabled>수락 (Tab)</button><button class="sec" id="dis" disabled>무시</button><span class="hint" id="cnt">0문장 · 0단어</span></div>
  <div class="row" style="margin-top:14px"><button id="go">다 썼어요 → 설문으로</button></div><p class="err" id="e"></p>`;
  const ta=$("#ta"), typed=$("#typed"), ghost=$("#ghost"), acc=$("#acc"), dis=$("#dis"), ed=$("#ed");
  let used = log.events.filter(e=>e.type==="accepted").length + log.events.filter(e=>e.type==="dismissed").length;
  let cur = null, timer=null, start = store.a2start || Date.now(); store.a2start = start; save();
  ta.value = store.a2text || "";
  const refresh=()=>{ typed.textContent = ta.value; const s=(ta.value.match(/[.!?。]\s|[.!?]$|다\.|요\./g)||[]).length; $("#cnt").textContent = `${s}문장 · ${wordCount(ta.value)}단어`; };
  refresh();
  const show=()=>{ if (cur || used>=sugg.length || ta.value.trim().length<10) return;
    cur = sugg[used]; const needSpace = ta.value.length && !/\s$/.test(ta.value); ghost.textContent = (needSpace?" ":"") + cur; acc.disabled=false; dis.disabled=false;
    log.shown++; log.events.push({type:"shown", idx:used, t:Date.now()-start}); store.a2log=log; save(); };
  const hide=(why)=>{ if (!cur) return; if (why==="dismissed"){ log.dismissed++; log.events.push({type:"dismissed", idx:used, t:Date.now()-start}); used++; } ghost.textContent=""; cur=null; acc.disabled=true; dis.disabled=true; store.a2log=log; save(); };
  const accept=()=>{ if (!cur) return; const needSpace = ta.value.length && !/\s$/.test(ta.value); ta.value += (needSpace?" ":"") + cur + " "; log.accepted++; log.acceptedWords += wordCount(cur); log.events.push({type:"accepted", idx:used, t:Date.now()-start}); used++; ghost.textContent=""; cur=null; acc.disabled=true; dis.disabled=true; store.a2text=ta.value; store.a2log=log; save(); refresh(); ta.focus(); };
  // 입력 감지는 이벤트가 아니라 값 폴링으로 (모바일 한글 IME는 input 이벤트가 불규칙) — 1.5초 멈추면 제안
  let lastVal = ta.value, lastChange = Date.now(), shownFor = null;
  const onChange=()=>{ const v=ta.value; if (v===lastVal) return false; lastVal=v; lastChange=Date.now(); if (cur) hide("dismissed"); refresh(); store.a2text=v; save(); return true; };
  ta.addEventListener("input", onChange);
  ta.addEventListener("compositionupdate", onChange);
  timer = setInterval(()=>{
    if (!document.body.contains(ta)) { clearInterval(timer); return; }
    if (onChange()) return;
    if (!cur && Date.now()-lastChange>=1500 && ta.value.trim().length>=10 && ta.value!==shownFor) { shownFor=ta.value; show(); }
  }, 200);
  ta.addEventListener("keydown", e=>{ if (e.key==="Tab" && cur){ e.preventDefault(); accept(); } if (e.key==="Escape" && cur){ hide("dismissed"); } });
  ta.addEventListener("focus", ()=>ed.classList.add("focus")); ta.addEventListener("blur", ()=>ed.classList.remove("focus"));
  acc.onclick = accept; dis.onclick = ()=>hide("dismissed");
  // timer
  const tick=()=>{ const left = Math.max(0, 300 - Math.floor((Date.now()-start)/1000)); $("#tm").textContent = `${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`; if (left===0) $("#tm").textContent="시간 종료 — 마무리하세요"; };
  tick(); const tt=setInterval(tick,1000);
  $("#go").onclick = ()=>{ if (wordCount(ta.value) < 15){ $("#e").textContent="조금 더 써 주세요(5문장 이상)."; return; } clearInterval(tt); store.a2text=ta.value; store.a2log=log; store.a2secs=Math.round((Date.now()-start)/1000); store.a2phase="survey"; save(); render("a2"); };
}

  h += `<h2>② 자동완성 글쓰기 <span class="small">(A 찬성편향 n = ${s.a2.A.n} · B 반대편향 n = ${s.a2.B.n})</span></h2><div class="card">
   <table><tr><th>지표</th><th>카드 A</th><th>카드 B</th><th>논문(실험 1)</th></tr>
   <tr><td>‘출석 점수 폐지’ 태도 평균 (1–5)</td><td><b>${f2(s.a2.A.t1)}</b></td><td><b>${f2(s.a2.B.t1)}</b></td><td>AI 처치가 통제보다 +0.44</td></tr>
   <tr><td>제안 1개 이상 수락 비율</td><td>${pct(s.a2.A.anyAccept)}</td><td>${pct(s.a2.B.anyAccept)}</td><td>수락 0건 30.8%</td></tr>
   <tr><td>평균 수락 횟수 / 수락 단어</td><td>${f2(s.a2.A.accepted)} / ${f2(s.a2.A.acceptedWords)}</td><td>${f2(s.a2.B.accepted)} / ${f2(s.a2.B.acceptedWords)}</td><td>수락 단어↑ → 효과↑</td></tr>
   <tr><td>“균형 잡혀 있었다” 동의(4–5) 비율</td><td>${pct(s.a2.A.balanced)}</td><td>${pct(s.a2.B.balanced)}</td><td>“균형 아님” 19%뿐</td></tr>
   <tr><td>“내 생각에 영향” 동의(4–5) 비율</td><td>${pct(s.a2.A.influenced)}</td><td>${pct(s.a2.B.influenced)}</td><td>31%</td></tr>
   <tr><td>방해 문항 평균 (d1/d2/d3)</td><td>${f2(s.a2.A.d1)}/${f2(s.a2.A.d2)}/${f2(s.a2.A.d3)}</td><td>${f2(s.a2.B.d1)}/${f2(s.a2.B.d2)}/${f2(s.a2.B.d3)}</td><td>차이 없어야 정상</td></tr></table>
   <p class="hint">A−B 차이 = ${f2((s.a2.A.t1??0)-(s.a2.B.t1??0))} (양수면 카드 방향대로 움직임). 수락 단어 수와 태도의 상관: ${f2(s.a2.corr)}</p></div>`;
  // ③ 토론
  h += `<h2>③ AI 토론 <span class="small">(목표 카드 n = ${s.a3.목표.n} · 자유 카드 n = ${s.a3.자유.n})</span></h2><div class="card">
   <table><tr><th>지표</th><th>목표 카드</th><th>자유 카드</th><th>논문(실험 2, AI 틀)</th></tr>
   <tr><td>AI 쪽으로 이동 (−10~+10 척도)</td><td><b>${f2(s.a3.목표.toward)}</b></td><td><b>${f2(s.a3.자유.toward)}</b></td><td>—</td></tr>
   <tr><td>“마음이 바뀌었다” (1–7)</td><td><b>${f2(s.a3.목표.change)}</b></td><td><b>${f2(s.a3.자유.change)}</b></td><td>목표 1.83 vs 통제 2.50</td></tr>
   <tr><td>반박 표지 (자동 계산)</td><td><b>${f2(s.a3.목표.markers)}</b></td><td><b>${f2(s.a3.자유.markers)}</b></td><td>논증성 2.72 vs 2.12</td></tr>
   <tr><td>반박 표지 (학생 추정)</td><td>${f2(s.a3.목표.selfCount)}</td><td>${f2(s.a3.자유.selfCount)}</td><td>—</td></tr>
   <tr><td>내 메시지 단어 수</td><td>${f2(s.a3.목표.myWords)}</td><td>${f2(s.a3.자유.myWords)}</td><td>AI 틀 34.6 vs 사람 틀 41.1</td></tr></table>
   <p class="hint">예측: 목표 카드 쪽이 반박 표지↑ · 변화↓. 모두 ‘AI 틀’이고 목적을 아는 참가자라는 점을 해석에 반영.</p></div>`;
  // ④ 판정
  h += `<h2>④ 문장 판정 <span class="small">(n = ${s.a4.n})</span></h2><div class="card">${ACT4.map(it=>bar(it.id.toUpperCase().replace("GA","가").replace("NA","나").replace("DA","다").replace("RA","라")+` (${it.ans})`, s.a4.n? (s.a4.correct[it.id]||0)/s.a4.n : 0, 1, "", pct)).join("")}<p class="hint">막대 = 정답률</p></div>`;
  return h;
}

/* =====================================================================
   QR 뷰 (?view=qr) — 학생용 주소를 QR로 표시
   ===================================================================== */
function vQR(){
  const url = params.get("url") || (location.origin + location.pathname);
  $("#hdr-sub").textContent = "학생용 QR — 프로젝터에 띄우세요";
  $("#main").innerHTML = `<div class="card center"><div id="qr" style="display:inline-block;background:#fff;padding:16px;border-radius:12px"></div><p style="font-size:18px;word-break:break-all"><b>${esc(url)}</b></p><p class="hint">카메라로 QR을 찍으면 바로 열립니다.${params.get("url") ? " (LMS 로그인 후 열림)" : " 로그인·설치 없음."}</p>
  <p class="small">테스트용 주소: ${esc(url)}?test=1 · 결과 화면: ${esc(url)}?view=result</p></div>`;
  const s=document.createElement("script"); s.src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";
  s.onload=()=>{ new QRCode($("#qr"), { text:url, width:320, height:320, correctLevel: QRCode.CorrectLevel.M }); };
  s.onerror=()=>{ $("#qr").innerHTML = `<p class="err">QR 라이브러리를 불러오지 못했습니다. 주소를 그대로 공유하세요.</p>`; };
  document.body.appendChild(s);
}

/* ---------- 시작 ---------- */
(async function(){
  if (VIEW==="result") return vResult();
  if (VIEW==="qr") return vQR();
  await pollState();
  render(store.step && store.token ? store.step : "intro");
})();
</script>
